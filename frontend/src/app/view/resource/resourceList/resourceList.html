<tf-page-header title="Tài liệu học tập" subtitle="Kho tài liệu PDF, video và học liệu bổ sung">
  <button *ngIf="canManage" type="button" tfButton variant="primary" size="md" (click)="showCreate = !showCreate">
    <lucide-icon [name]="showCreate ? 'x' : 'plus'" class="h-4 w-4"></lucide-icon>
    {{ showCreate ? 'Đóng' : 'Thêm tài liệu' }}
  </button>
</tf-page-header>

<!-- ══ CREATE FORM ═════════════════════════════════════════════════════════ -->
<div *ngIf="showCreate && canManage" tfCard tone="white" padding="lg" class="mb-8 animate-fade-up">
  <h2 class="text-xl font-extrabold tracking-heading">Thêm tài liệu mới</h2>

  <form [formGroup]="createForm" (ngSubmit)="onCreate()" class="mt-6 flex flex-col gap-5">
    <div class="grid gap-5 sm:grid-cols-2">
      <tf-field label="Tiêu đề" [required]="true" for="r-title">
        <input id="r-title" tfInput formControlName="title" placeholder="Bảng chữ cái tiếng Pháp" />
      </tf-field>
      <tf-field label="Danh mục" for="r-cat">
        <input id="r-cat" tfInput formControlName="category" placeholder="Ngữ pháp, Từ vựng..." />
      </tf-field>
    </div>

    <tf-field label="Mô tả" for="r-desc">
      <textarea id="r-desc" tfInput formControlName="description" rows="2"
                placeholder="Video học bảng chữ cái và cách phát âm"></textarea>
    </tf-field>

    <tf-field label="URL tài liệu" [required]="true" for="r-url"
              hint="Google Drive, YouTube, link PDF...">
      <input id="r-url" tfInput formControlName="fileUrl" placeholder="https://..." />
    </tf-field>

    <!-- Flat checkbox: a solid block that fills when checked -->
    <label class="flex cursor-pointer items-center gap-3 rounded-md bg-muted p-4 transition-colors duration-200 hover:bg-line">
      <input type="checkbox" formControlName="isPublic"
             class="h-5 w-5 shrink-0 cursor-pointer rounded border-2 border-line text-primary focus:ring-primary" />
      <span class="font-semibold text-ink-soft">Công khai — tất cả học viên đều thấy tài liệu này</span>
    </label>

    <div class="flex flex-wrap justify-end gap-3">
      <button type="button" tfButton variant="secondary" size="md" (click)="showCreate = false">Huỷ</button>
      <button type="submit" tfButton variant="primary" size="md" [disabled]="createForm.invalid || saving">
        {{ saving ? 'Đang lưu...' : 'Thêm tài liệu' }}
      </button>
    </div>
  </form>
</div>

<!-- ══ CATEGORY FILTER ═════════════════════════════════════════════════════ -->
<div *ngIf="categories.length" class="mb-8 flex flex-wrap gap-2">
  <button
    type="button"
    (click)="filterCategory(null)"
    class="rounded-full px-4 py-2 text-xs font-semibold uppercase tracking-wider transition-all duration-200"
    [ngClass]="!activeCategory ? 'bg-ink text-white' : 'bg-white text-ink-muted hover:bg-line hover:text-ink'"
  >
    Tất cả
  </button>
  <button
    *ngFor="let cat of categories"
    type="button"
    (click)="filterCategory(cat)"
    class="rounded-full px-4 py-2 text-xs font-semibold uppercase tracking-wider transition-all duration-200"
    [ngClass]="activeCategory === cat ? 'bg-primary text-white' : 'bg-white text-ink-muted hover:bg-line hover:text-ink'"
  >
    {{ cat }}
  </button>
</div>

<tf-spinner *ngIf="loading" size="md" label="Đang tải tài liệu..."></tf-spinner>

<!-- ══ GRID ════════════════════════════════════════════════════════════════ -->
<div *ngIf="!loading">
  <div *ngIf="filtered.length" class="grid gap-5 lg:grid-cols-2">
    <div *ngFor="let r of filtered" tfCard tone="white" padding="lg" class="flex gap-5">
      <span class="flex h-16 w-16 shrink-0 items-center justify-center rounded-full" [ngClass]="kindOf(r.fileUrl).chip">
        <lucide-icon [name]="kindOf(r.fileUrl).icon" class="h-7 w-7" [strokeWidth]="2.5"></lucide-icon>
      </span>

      <div class="min-w-0 flex-1">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="flex flex-wrap gap-2">
              <span *ngIf="r.category" tfBadge tone="primary-soft" [square]="true">{{ r.category }}</span>
              <span *ngIf="r.isPublic" tfBadge tone="secondary-soft" [square]="true">Công khai</span>
            </div>
            <h3 class="mt-3 text-lg font-bold leading-snug tracking-heading">{{ r.title }}</h3>
            <p *ngIf="r.description" class="mt-2 line-clamp-2 text-ink-muted">{{ r.description }}</p>
          </div>

          <button
            *ngIf="canManage"
            type="button"
            (click)="onDelete(r.id)"
            tfButton variant="ghost" size="icon"
            class="shrink-0 !text-danger hover:!bg-danger-soft"
            aria-label="Xoá tài liệu"
          >
            <lucide-icon name="trash-2" class="h-5 w-5"></lucide-icon>
          </button>
        </div>

        <div class="mt-5 flex flex-wrap items-center gap-x-5 gap-y-3 border-t-2 border-muted pt-5">
          <span class="flex items-center gap-1.5 text-sm text-ink-muted">
            <lucide-icon name="user" class="h-4 w-4"></lucide-icon>{{ r.uploadedBy }}
          </span>
          <span class="flex items-center gap-1.5 text-sm text-ink-muted">
            <lucide-icon name="calendar" class="h-4 w-4"></lucide-icon>{{ r.createdAt | date: 'dd/MM/yy' }}
          </span>
          <a [href]="r.fileUrl" target="_blank" rel="noopener" tfButton variant="primary" size="sm" class="ml-auto">
            <lucide-icon name="external-link" class="h-4 w-4"></lucide-icon>
            Mở
          </a>
        </div>
      </div>
    </div>
  </div>

  <tf-empty-state
    *ngIf="!filtered.length"
    icon="folder-open"
    title="Chưa có tài liệu nào"
    [description]="activeCategory ? 'Không có tài liệu trong danh mục này.' : 'Tài liệu sẽ xuất hiện khi giáo viên tải lên.'"
  ></tf-empty-state>
</div>
