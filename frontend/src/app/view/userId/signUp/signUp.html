<div class="grid min-h-screen lg:grid-cols-2">
  <!-- ══ FORM PANEL ═════════════════════════════════════════════════════════ -->
  <main class="order-2 flex flex-col justify-center bg-white px-6 py-14 sm:px-14 lg:order-1">
    <div class="mx-auto w-full max-w-md">
      <a routerLink="/home" class="mb-10 inline-flex items-center gap-2 text-sm font-semibold text-ink-muted no-underline transition-colors duration-200 hover:text-ink lg:hidden">
        <lucide-icon name="arrow-left" class="h-4 w-4"></lucide-icon>
        Về trang chủ
      </a>

      <h1 class="text-4xl font-extrabold tracking-heading">Tạo tài khoản</h1>
      <p class="mt-3 text-ink-muted">Miễn phí, không cần thẻ thanh toán.</p>

      <div *ngIf="error" class="mt-8 flex items-start gap-3 rounded-md bg-danger-soft p-4">
        <lucide-icon name="circle-alert" class="mt-0.5 h-5 w-5 shrink-0 text-danger" [strokeWidth]="2.5"></lucide-icon>
        <p class="font-medium text-danger-dark">{{ error }}</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-8 flex flex-col gap-5">
        <tf-field label="Họ và tên" [required]="true" for="reg-name"
                  [error]="showError('fullName') ? 'Vui lòng nhập ít nhất 2 ký tự.' : null">
          <input id="reg-name" tfInput formControlName="fullName"
                 placeholder="Nguyễn Văn A" autocomplete="name" [invalid]="showError('fullName')" />
        </tf-field>

        <tf-field label="Email" [required]="true" for="reg-email"
                  [error]="showError('email') ? 'Email không hợp lệ.' : null">
          <input id="reg-email" tfInput type="email" formControlName="email"
                 placeholder="you@example.com" autocomplete="email" [invalid]="showError('email')" />
        </tf-field>

        <tf-field label="Số điện thoại" hint="Không bắt buộc" for="reg-phone">
          <input id="reg-phone" tfInput formControlName="phoneNumber"
                 placeholder="0901 234 567" autocomplete="tel" />
        </tf-field>

        <tf-field label="Mật khẩu" [required]="true" for="reg-password"
                  [error]="showError('password') ? 'Mật khẩu tối thiểu 6 ký tự.' : null">
          <div class="relative">
            <input id="reg-password" tfInput [type]="showPass ? 'text' : 'password'"
                   formControlName="password" placeholder="••••••••" autocomplete="new-password"
                   class="!pr-14" [invalid]="showError('password')" />
            <button type="button" (click)="showPass = !showPass"
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-ink-muted transition-transform duration-200 hover:scale-110 hover:text-ink"
                    [attr.aria-label]="showPass ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'">
              <lucide-icon [name]="showPass ? 'eye-off' : 'eye'" class="h-5 w-5"></lucide-icon>
            </button>
          </div>
        </tf-field>

        <button type="submit" tfButton variant="primary" size="lg" [block]="true" [disabled]="loading" class="mt-3">
          <lucide-icon *ngIf="loading" name="loader-circle" class="h-5 w-5 animate-spin-flat"></lucide-icon>
          {{ loading ? 'Đang tạo tài khoản...' : 'Đăng ký miễn phí' }}
        </button>
      </form>

      <p class="mt-8 text-center text-ink-muted">
        Đã có tài khoản?
        <a routerLink="/auth/login" class="font-bold text-primary no-underline hover:underline">Đăng nhập</a>
      </p>
    </div>
  </main>

  <!-- ══ POSTER PANEL ════════════════════════════════════════ Emerald block -->
  <aside class="relative order-1 hidden overflow-hidden bg-secondary p-14 lg:order-2 lg:flex lg:flex-col lg:justify-between">
    <span class="pointer-events-none absolute -left-28 -top-24 h-96 w-96 rounded-full bg-white/10"></span>
    <span class="pointer-events-none absolute -bottom-28 -right-16 h-72 w-72 rotate-12 rounded-lg bg-white/10"></span>

    <a routerLink="/home" class="relative flex justify-end no-underline">
      <tf-logo variant="full" tone="white" sizeClass="h-32"></tf-logo>
    </a>

    <div class="relative text-right">
      <h2 class="text-5xl font-extrabold leading-tight tracking-heading text-white">
        Commençons !<br /><span class="text-ink">Bắt đầu ngay hôm nay.</span>
      </h2>
      <p class="ml-auto mt-6 max-w-md text-lg text-white/80">
        Tạo tài khoản trong 30 giây và truy cập ngay tài liệu mẫu của trung tâm.
      </p>
    </div>

    <div class="relative grid grid-cols-3 gap-4">
      <div *ngFor="let stat of stats" class="rounded-lg bg-white/10 p-5 text-center">
        <div class="text-3xl font-extrabold tracking-heading text-white">{{ stat.value }}</div>
        <p class="mt-1 text-xs font-semibold uppercase tracking-wider text-white/70">{{ stat.label }}</p>
      </div>
    </div>
  </aside>
</div>
