<tf-page-header title="Hồ sơ của tôi" subtitle="Cập nhật thông tin cá nhân và mật khẩu"></tf-page-header>

<div class="grid gap-6 lg:grid-cols-[20rem_1fr]">
  <!-- ══ IDENTITY CARD ═══════════════════════════════════════════ Blue block -->
  <div tfCard tone="primary" padding="lg" class="h-fit text-center">
    <span class="mx-auto flex h-24 w-24 items-center justify-center rounded-full bg-white text-4xl font-extrabold text-primary">
      {{ initial }}
    </span>

    <h2 class="mt-6 text-2xl font-extrabold tracking-heading text-white">{{ profile?.fullName }}</h2>

    <span tfBadge tone="accent" [square]="true" class="mt-3">{{ profile?.role }}</span>

    <div class="mt-8 space-y-4 border-t-2 border-white/20 pt-6 text-left">
      <div class="flex items-start gap-3">
        <lucide-icon name="mail" class="mt-0.5 h-5 w-5 shrink-0 text-accent"></lucide-icon>
        <div class="min-w-0">
          <p class="text-xs font-semibold uppercase tracking-wider text-white/60">Email</p>
          <p class="truncate font-semibold text-white">{{ profile?.email }}</p>
        </div>
      </div>
      <div class="flex items-start gap-3">
        <lucide-icon name="calendar" class="mt-0.5 h-5 w-5 shrink-0 text-accent"></lucide-icon>
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-white/60">Tham gia</p>
          <p class="font-semibold text-white">{{ profile?.createdAt | date: 'dd/MM/yyyy' }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="flex flex-col gap-6">
    <!-- ══ EDIT PROFILE ══════════════════════════════════════════════════ -->
    <div tfCard tone="white" padding="lg">
      <h2 class="flex items-center gap-3 text-xl font-extrabold tracking-heading">
        <lucide-icon name="square-pen" class="h-5 w-5 text-primary" [strokeWidth]="2.5"></lucide-icon>
        Chỉnh sửa thông tin
      </h2>

      <form [formGroup]="profileForm" (ngSubmit)="onSaveProfile()" class="mt-6 flex flex-col gap-5">
        <tf-field label="Họ và tên" [required]="true" for="p-name">
          <input id="p-name" tfInput formControlName="fullName" autocomplete="name" />
        </tf-field>

        <div class="grid gap-5 sm:grid-cols-2">
          <tf-field label="Số điện thoại" for="p-phone">
            <input id="p-phone" tfInput formControlName="phoneNumber" autocomplete="tel" placeholder="0901 234 567" />
          </tf-field>
          <tf-field label="URL ảnh đại diện" for="p-avatar">
            <input id="p-avatar" tfInput formControlName="avatarUrl" placeholder="https://..." />
          </tf-field>
        </div>

        <button type="submit" tfButton variant="primary" size="md"
                [disabled]="profileSaving || profileForm.invalid" class="self-start">
          {{ profileSaving ? 'Đang lưu...' : 'Lưu thay đổi' }}
        </button>
      </form>
    </div>

    <!-- ══ CHANGE PASSWORD ═══════════════════════════════════════════════ -->
    <div tfCard tone="muted" padding="lg">
      <h2 class="flex items-center gap-3 text-xl font-extrabold tracking-heading">
        <lucide-icon name="lock" class="h-5 w-5 text-danger" [strokeWidth]="2.5"></lucide-icon>
        Đổi mật khẩu
      </h2>

      <form [formGroup]="pwForm" (ngSubmit)="onChangePassword()" class="mt-6 flex flex-col gap-5">
        <tf-field label="Mật khẩu hiện tại" [required]="true" for="p-current">
          <div class="relative">
            <input id="p-current" tfInput [type]="showCurrent ? 'text' : 'password'"
                   formControlName="currentPassword" autocomplete="current-password" class="!bg-white !pr-14" />
            <button type="button" (click)="showCurrent = !showCurrent"
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-ink-muted transition-transform duration-200 hover:scale-110 hover:text-ink"
                    [attr.aria-label]="showCurrent ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'">
              <lucide-icon [name]="showCurrent ? 'eye-off' : 'eye'" class="h-5 w-5"></lucide-icon>
            </button>
          </div>
        </tf-field>

        <div class="grid gap-5 sm:grid-cols-2">
          <tf-field label="Mật khẩu mới" [required]="true" for="p-new" hint="Ít nhất 6 ký tự">
            <div class="relative">
              <input id="p-new" tfInput [type]="showNew ? 'text' : 'password'"
                     formControlName="newPassword" autocomplete="new-password" class="!bg-white !pr-14" />
              <button type="button" (click)="showNew = !showNew"
                      class="absolute right-4 top-1/2 -translate-y-1/2 text-ink-muted transition-transform duration-200 hover:scale-110 hover:text-ink"
                      [attr.aria-label]="showNew ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'">
                <lucide-icon [name]="showNew ? 'eye-off' : 'eye'" class="h-5 w-5"></lucide-icon>
              </button>
            </div>
          </tf-field>

          <tf-field label="Nhập lại mật khẩu mới" [required]="true" for="p-confirm"
                    [error]="pwMismatch ? 'Mật khẩu không khớp.' : null">
            <input id="p-confirm" tfInput [type]="showNew ? 'text' : 'password'"
                   formControlName="confirmPassword" autocomplete="new-password"
                   class="!bg-white" [invalid]="pwMismatch" />
          </tf-field>
        </div>

        <button type="submit" tfButton variant="danger" size="md"
                [disabled]="pwSaving || pwForm.invalid" class="self-start">
          {{ pwSaving ? 'Đang đổi...' : 'Đổi mật khẩu' }}
        </button>
      </form>
    </div>
  </div>
</div>
