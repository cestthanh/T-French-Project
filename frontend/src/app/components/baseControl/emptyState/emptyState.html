<div class="flex flex-col items-center gap-4 rounded-lg bg-muted px-6 py-14 text-center">
  <span class="flex h-16 w-16 items-center justify-center rounded-full bg-white">
    <lucide-icon [name]="icon" class="h-7 w-7 text-ink-muted" [strokeWidth]="2.5"></lucide-icon>
  </span>
  <div>
    <p class="text-lg font-bold tracking-heading text-ink">{{ title }}</p>
    <p *ngIf="description" class="mt-1 text-ink-muted">{{ description }}</p>
  </div>
  <ng-content></ng-content>
</div>
