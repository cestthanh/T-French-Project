<div class="max-w-3xl" [class.mb-12]="!flush" [class.mx-auto]="center" [class.text-center]="center">
  <span *ngIf="eyebrow" class="eyebrow" [ngClass]="eyebrowClass">{{ eyebrow }}</span>
  <h2 class="mt-3 text-3xl font-extrabold tracking-heading sm:text-4xl lg:text-5xl">
    {{ title }}
  </h2>
  <p *ngIf="lead" class="mt-4 text-lg leading-relaxed" [ngClass]="leadClass">{{ lead }}</p>
</div>
