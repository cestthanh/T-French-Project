<div class="flex flex-col gap-2">
  <label *ngIf="label" [attr.for]="for" class="eyebrow text-ink-soft">
    {{ label }}
    <span *ngIf="required" class="text-danger">*</span>
  </label>

  <ng-content></ng-content>

  <p *ngIf="error" class="flex items-center gap-1.5 text-sm font-medium text-danger">
    <lucide-icon name="circle-alert" class="h-4 w-4 shrink-0"></lucide-icon>
    {{ error }}
  </p>
  <p *ngIf="hint && !error" class="text-sm text-ink-muted">{{ hint }}</p>
</div>
