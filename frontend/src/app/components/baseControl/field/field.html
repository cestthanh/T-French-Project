<div class="flex flex-col gap-2">
  @if (label) {
    <label [attr.for]="for" class="eyebrow text-ink-soft">
      {{ label }}
      @if (required) {
        <span class="text-danger">*</span>
      }
    </label>
  }

  <ng-content></ng-content>

  @if (error) {
    <p class="flex items-center gap-1.5 text-sm font-medium text-danger">
      <lucide-icon name="circle-alert" class="h-4 w-4 shrink-0"></lucide-icon>
      {{ error }}
    </p>
  }
  @if (hint && !error) {
    <p class="text-sm text-ink-muted">{{ hint }}</p>
  }
</div>
